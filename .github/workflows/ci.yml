name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS, matching Vercel's current default runtime. On 22 the
          # runner shipped npm 10, which cannot reconcile a lockfile written
          # by npm 11, so npm ci failed here while succeeding everywhere else.
          node-version: '24'
          cache: npm
      - run: node scripts/fix-lockfile.mjs
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
